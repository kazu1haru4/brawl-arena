<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11132b"><title>BRAWL ARENA | マッチメイキング</title>
<style>
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#11152a;color:#fff;font-family:system-ui,-apple-system,sans-serif}.page{min-height:100dvh;display:flex;flex-direction:column}.top{height:52px;display:flex;align-items:center;justify-content:space-between;padding:0 14px;background:#0b0e20;border-bottom:1px solid #41466f}.brand{color:#d8b6ff;text-decoration:none;font-size:13px;font-weight:1000}.btn{border:1px solid #656da2;border-radius:10px;padding:8px 12px;color:white;background:#292f58;font-weight:900}.center{flex:1;display:flex;align-items:center;justify-content:center;padding:20px}.card{width:100%;max-width:370px;text-align:center;background:linear-gradient(145deg,#28294f,#15192f);border:2px solid #7772c4;border-radius:24px;padding:26px 22px;box-shadow:0 16px 48px #0005}.spinner{width:46px;height:46px;border:5px solid #ffffff30;border-top-color:#ffcf4a;border-right-color:#ffcf4a;border-radius:50%;margin:0 auto 18px;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}h1{font-size:25px;margin:0 0 10px}p{color:#c8d0ef;line-height:1.6}.status{min-height:48px;font-weight:800;color:#ffe7a0}.progress{height:9px;border-radius:99px;background:#ffffff20;overflow:hidden;margin:16px 0}.bar{height:100%;width:8%;border-radius:99px;background:linear-gradient(90deg,#ffcf4a,#ff8a32);transition:width .35s}.team{display:flex;justify-content:center;gap:8px;flex-wrap:wrap;margin:18px 0}.slot{width:43px;height:43px;border-radius:12px;display:grid;place-items:center;background:#ffffff12;border:1px solid #ffffff25;font-size:22px}.note{font-size:12px;color:#aab4d9}.cancel{width:100%;padding:12px;border-radius:12px;border:1px solid #6c74a4;background:#252b50;color:#fff;font-weight:900;margin-top:10px}
</style></head><body><div class="page"><header class="top"><a class="brand" href="home.html">✦ BRAWL ARENA</a><button class="btn" id="home">ホームへ</button></header><main class="center"><section class="card"><div class="spinner"></div><h1>🔎 マッチメイキング中</h1><p>サバイバルの対戦相手を探しています…</p><div class="status" id="status">プレイヤーを検索中…</div><div class="progress"><div class="bar" id="bar"></div></div><div class="team" id="team"><div class="slot">?</div><div class="slot">?</div><div class="slot">?</div><div class="slot">?</div><div class="slot">?</div><div class="slot">?</div><div class="slot">?</div><div class="slot">?</div><div class="slot">?</div><div class="slot">🟣</div></div><p class="note">参加者が見つからない枠はボットで補充します。ボット同士もバトル中に戦います。</p><button class="cancel" id="cancel">キャンセル</button></section></main></div>
<script>
const statusEl=document.getElementById('status'),bar=document.getElementById('bar'),team=document.getElementById('team');let step=0;const steps=[['プレイヤーを検索中…',18],['参加プレイヤーが見つからないため、空き枠をボットで補充中…',55],['ボットの参加準備中…',82],['マッチ成立！バトルへ移動します！',100]];const timers=[700,1700,2700,3500].map((ms,i)=>setTimeout(()=>{statusEl.textContent=steps[i][0];bar.style.width=steps[i][1]+'%';if(i===1){team.innerHTML='';for(let j=0;j<9;j++){const el=document.createElement('div');el.className='slot';el.textContent=['🤖','🟠','🟣','🤖','🟢','🤖','🔵','🤖','🟡'][j];team.append(el)}const me=document.createElement('div');me.className='slot';me.textContent='🟣';me.style.borderColor='#d8a5ff';team.append(me)}if(i===3)location.href='survival.html?match=bot';},ms));function goHome(){timers.forEach(clearTimeout);location.href='modes.html'}document.getElementById('home').onclick=goHome;document.getElementById('cancel').onclick=goHome;
</script></body></html>
