(async()=>{let CHARACTER;try{const response=await fetch('characters.json',{cache:'no-cache'});if(!response.ok)throw new Error('characters.json '+response.status);const registry=await response.json();const selectedId=localStorage.getItem('ba_selected_character_id')||registry.defaultCharacterId;CHARACTER=registry.characters.find(ch=>ch.id===selectedId)||registry.characters.find(ch=>ch.id===registry.defaultCharacterId)||registry.characters[0];if(!CHARACTER)throw new Error('キャラデータがありません');}catch(error){document.body.innerHTML='<div style="padding:24px;color:white;background:#101327;font-family:system-ui"><h2>キャラデータを読み込めません</h2><p>GitHubに characters.json をアップロードして、もう一度開いてね。</p></div>';console.error(error);return;}const setButtonLabel=(id,icon,label)=>{const el=document.getElementById(id);if(el){el.replaceChildren();el.append(document.createTextNode(icon+' '));const small=document.createElement('small');small.textContent=label||'';el.append(small);}};setButtonLabel('pullBtn','☻',CHARACTER.gadget?.name||'ガジェット');setButtonLabel('hyperBtn','⚡',CHARACTER.hypercharge?.name||'ハイパー');const superCaption=document.querySelector('.super-mini');if(superCaption)superCaption.textContent=(CHARACTER.super?.name||'ウルト')+'照準';const MAX_HP=Number(CHARACTER.maxHp)||4800;const $=id=>document.getElementById(id);const authToken=localStorage.getItem('ba_auth_token');let authUser=null;try{authUser=JSON.parse(localStorage.getItem('ba_current_user')||'null')}catch{}if(!authToken||!authUser||!(authUser.userId||authUser.id)){localStorage.removeItem('ba_auth_token');localStorage.removeItem('ba_current_user');location.replace('index.html');return}
const c=$('arena'),ctx=c.getContext('2d');let W=800,H=500,viewW=400,viewH=300,camX=0,camY=0,dpr=1,last=0,ended=false,elapsed=0,countdownRemaining=5.55,matchStarted=false,move={x:0,y:0},aim={x:1,y:0},movePid=null,aimPid=null,superAimPid=null,aimActive=false,superAimActive=false,shots=[],particles=[],portals=[],bots=[],crates=[],kills=0,power=0,hp=MAX_HP,ammo=Number(CHARACTER.attack?.ammo ?? CHARACTER.ammo)||3,reloadTimer=0,fireCd=0,superCd=0,stormRadius=1,stormTimer=15,healCd=0;let feedId=0;
const remotePlayers=new Map();let onlineSocket=null,onlineReady=false,lastNetSend=0;const onlineParams=new URLSearchParams(location.search);const onlineRoom=onlineParams.get('room');const onlinePlayerId=onlineParams.get('player');const onlineMode=onlineParams.get('online')==='1'&&!!onlineRoom&&!!onlinePlayerId;
function sendOnline(data){if(onlineSocket&&onlineSocket.readyState===WebSocket.OPEN)onlineSocket.send(JSON.stringify(data));}
function connectOnline(){if(!onlineMode)return;const url=window.BRAWL_ARENA_WS_URL;if(!url||url.includes('YOUR-WEBSOCKET-SERVER')){console.warn('Online server URL is not configured.');return;}try{onlineSocket=new WebSocket(url);onlineSocket.addEventListener('open',()=>{onlineReady=true;sendOnline({type:'joinRoom',roomId:onlineRoom,playerId:onlinePlayerId});const m=document.getElementById('message');if(m){m.textContent='🌐 オンライン接続中';m.style.display='block';setTimeout(()=>{if(!ended)m.style.display='none'},1200)}});onlineSocket.addEventListener('message',e=>{let msg;try{msg=JSON.parse(e.data)}catch{return}if(msg.type==='roomState'){remotePlayers.clear();for(const p of msg.players||[])if(p.id!==onlinePlayerId&&!p.isBot)remotePlayers.set(p.id,p);const aliveCount=(msg.players||[]).filter(p=>p.alive).length;const el=document.getElementById('alive');if(el)el.textContent='🌐 オンライン参加 '+aliveCount+'人';}else if(msg.type==='state'&&msg.player&&msg.player.id!==onlinePlayerId){remotePlayers.set(msg.player.id,msg.player)}else if(msg.type==='playerJoined'&&msg.player&&msg.player.id!==onlinePlayerId){remotePlayers.set(msg.player.id,msg.player)}else if(msg.type==='playerLeft'){remotePlayers.delete(msg.playerId)}else if(msg.type==='event'&&msg.event==='killFeed'){addKillFeed(msg.name||'プレイヤー',String(msg.data?.target||'相手'))}else if(msg.type==='error'){const m=document.getElementById('message');if(m){m.textContent=msg.message||'オンライン接続エラー';m.style.display='block'}}});onlineSocket.addEventListener('close',()=>{onlineReady=false;remotePlayers.clear();const m=document.getElementById('message');if(m&&!ended){m.textContent='オンライン接続が切れました';m.style.display='block'}});onlineSocket.addEventListener('error',()=>{onlineReady=false;console.error('Online WebSocket error')})}catch(e){console.error('Could not connect online',e)}}
const MAP_SCALE=3;const player={x:0,y:0,r:16};let center={x:0,y:0},superAim={x:1,y:0},walls=[],bushes=[];
function resize(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);viewW=r.width;viewH=r.height;c.width=Math.max(1,Math.floor(viewW*dpr));c.height=Math.max(1,Math.floor(viewH*dpr));W=viewW*MAP_SCALE;H=viewH*MAP_SCALE;ctx.setTransform(dpr,0,0,dpr,0,0);center={x:W/2,y:H/2};camX=Math.max(0,Math.min(W-viewW,player.x-viewW/2));camY=Math.max(0,Math.min(H-viewH,player.y-viewH/2))}
function reset(){ended=false;elapsed=0;countdownRemaining=5.55;matchStarted=false;$('countdown').style.display='flex';$('countdown').textContent='5';kills=0;power=0;hp=MAX_HP;feedId=0;$('killFeed').replaceChildren();walls=[];bushes=[];

for(let i=0;i<22;i++){let x=70+((i*137+53)%(W-140)),y=95+((i*191+71)%(H-170));let ww=45+(i%3)*15,hh=32+(i%4)*10;if(Math.hypot(x-W/2,y-H/2)>100)walls.push({x,y,w:ww,h:hh});}
for(let i=0;i<26;i++){let x=45+((i*173+91)%(W-90)),y=85+((i*127+39)%(H-150));bushes.push({x,y,w:48+(i%3)*12,h:36+(i%2)*12});}fireCd=0;ammo=Number(CHARACTER.attack?.ammo ?? CHARACTER.ammo)||3;reloadTimer=0;superCd=0;healCd=0;stormRadius=1;stormTimer=15;shots=[];particles=[];portals=[];player.x=W*.5;player.y=H*.5;camX=Math.max(0,Math.min(W-viewW,player.x-viewW/2));camY=Math.max(0,Math.min(H-viewH,player.y-viewH/2));bots=[];for(let i=0;i<9;i++){let a=Math.PI*2*i/9+Math.random()*.3,rad=Math.min(W,H)*(.25+Math.random()*.13);bots.push({id:'bot'+i,x:Math.max(25,Math.min(W-25,center.x+Math.cos(a)*rad)),y:Math.max(70,Math.min(H-25,center.y+Math.sin(a)*rad)),r:15,hp:2500,maxHp:2500,cd:1+Math.random()*2,alive:true,spd:35+Math.random()*22,color:['#e75d70','#d78a43','#8e6be0','#43a9a4'][i%4]})}crates=[];for(let i=0;i<30;i++){let bx,by,tries=0;do{bx=35+Math.random()*(W-70);by=75+Math.random()*(H-120);tries++;}while(blocked(bx,by,18)&&tries<30);crates.push({x:bx,y:by,hp:1200,alive:true});}$('overlay').style.display='none';$('message').style.display='none';$('hp').textContent='❤️ '+(CHARACTER.name||'キャラ')+' HP '+Math.ceil(hp)+' / '+MAX_HP+'　リロード '+ammo+'/3';last=performance.now();requestAnimationFrame(loop)}
function nearest(list,from){return list.filter(o=>o.alive&&o!==from).map(o=>({o,d:Math.hypot(o.x-from.x,o.y-from.y)})).sort((a,b)=>a.d-b.d)[0]}
function addKillFeed(killer,target){const feed=$('killFeed'),entry=document.createElement('div');entry.className='kill-entry';entry.textContent=`${killer} ⚔ ${target}`;feed.prepend(entry);while(feed.children.length>4)feed.lastElementChild.remove();const id=++feedId;setTimeout(()=>{if(entry.isConnected&&id<=feedId)entry.remove()},5200)}
function botName(id){return id==='p'?(CHARACTER.name||'あなた'):'ボット'+(Number(String(id).replace('bot',''))+1)}
function shoot(){if(ended||!matchStarted||fireCd>0)return;fireCd=Number(CHARACTER.attack?.cooldown ?? CHARACTER.attackCooldown)||.32;sendOnline({type:'event',event:'attack',data:{x:player.x/W,y:player.y/H,dx:aim.x,dy:aim.y}});if(!aimActive){let target=nearest(bots,player);if(target){let dx=target.o.x-player.x,dy=target.o.y-player.y,d=Math.hypot(dx,dy)||1;aim={x:dx/d,y:dy/d}}}const speed=Number(CHARACTER.attack?.projectileSpeed ?? CHARACTER.projectileSpeed)||0;if(speed<=0){let hit=false;for(const b of bots){if(!b.alive)continue;const dx=b.x-player.x,dy=b.y-player.y,d=Math.hypot(dx,dy)||1;if(d<=(Number(CHARACTER.attack?.range ?? CHARACTER.attackRange)||115)+b.r&&(dx/d)*aim.x+(dy/d)*aim.y>.35){b.hp-=Number(CHARACTER.attack?.damage ?? CHARACTER.attackDamage)||0;hit=true;if(b.hp<=0){b.alive=false;kills++;crates.push({x:b.x,y:b.y,hp:0,alive:true,drop:true})}}}if(hit&&CHARACTER.gadget?.type==='healOnHit'){hp=Math.min(MAX_HP,hp+(Number(CHARACTER.gadget.amount)||0));}return;}if(ammo<=0){$('hp').textContent='リロード中…';return;}ammo--;if(ammo<(Number(CHARACTER.attack?.ammo ?? CHARACTER.ammo)||3)&&reloadTimer<=0)reloadTimer=Number(CHARACTER.attack?.reloadTime ?? CHARACTER.reloadTime)||.85;shots.push({x:player.x+aim.x*20,y:player.y+aim.y*20,vx:aim.x*speed,vy:aim.y*speed,life:1.15,owner:'p',dmg:(Number(CHARACTER.attack?.damage ?? CHARACTER.attackDamage)||0)+power*100})}
function setStick(e,el,knob,kind){let r=el.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),max=32;if(d>max){dx=dx/d*max;dy=dy/d*max}let z=Math.hypot(dx,dy);if(kind==='move'){move={x:dx/max,y:dy/max}}else if(z>10){aim={x:dx/z,y:dy/z};aimActive=true}knob.style.transform=`translate(${dx}px,${dy}px)`}

as.onpointerdown=e=>{if(!matchStarted||ended)return;e.preventDefault();aimPid=e.pointerId;as.setPointerCapture(aimPid);aimActive=false;setStick(e,as,ak,'aim')};as.onpointermove=e=>{if(e.pointerId===aimPid)setStick(e,as,ak,'aim')};as.onpointerup=e=>{if(e.pointerId!==aimPid)return;shoot();aimPid=null;aimActive=false;ak.style.transform=''};as.onpointercancel=()=>{aimPid=null;aimActive=false;ak.style.transform=''};

$('hyperBtn').onclick=()=>{if(!ended&&matchStarted){power=Math.min(10,power+1);$('message').textContent='⚡ ハイパーチャージ！パワーが上がった';$('message').style.display='block';setTimeout(()=>{if(!ended)$('message').style.display='none'},900)}};
$('pullBtn').onclick=()=>{if(ended||!matchStarted||healCd>0)return;const g=CHARACTER.gadget||{};healCd=Number(g.cooldown)||0;if(g.type==='healOnHit'){hp=Math.min(MAX_HP,hp+(Number(g.amount)||0));$('message').textContent=(g.name||'ガジェット')+' 発動！';}else if(g.type==='heal'){hp=Math.min(MAX_HP,hp+(Number(g.amount)||800));}else if(g.type==='pull'){const target=nearest(bots,player);if(target&&target.d<=(Number(g.range)||300)){target.o.x=player.x+aim.x*38;target.o.y=player.y+aim.y*38;target.o.hp-=Number(g.amount)||350;}}for(let i=0;i<16;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,t:.5,col:'#77ff8a'})};
function useSuper(){if(ended||!matchStarted)return;const superType=CHARACTER.super?.type||'projectile';if(superCd>0){$('message').textContent='ウルトはあと '+superCd.toFixed(1)+' 秒で使えるよ';$('message').style.display='block';setTimeout(()=>{if(!ended)$('message').style.display='none'},900);return}if(superType==='jump'){const cfg=CHARACTER.super||{};const from={x:player.x,y:player.y};const distance=Number(cfg.distance)||150;player.x=Math.max(player.r+4,Math.min(W-player.r-4,player.x+superAim.x*distance));player.y=Math.max(55+player.r,Math.min(H-player.r-4,player.y+superAim.y*distance));for(const b of bots){if(b.alive&&Math.hypot(b.x-player.x,b.y-player.y)<=(Number(cfg.landingRadius)||85)){b.hp-=Number(cfg.landingDamage||CHARACTER.superDamage)||1200;if(b.hp<=0){b.alive=false;kills++;crates.push({x:b.x,y:b.y,hp:0,alive:true,drop:true})}}}superCd=Number(cfg.cooldown)||8;sendOnline({type:'event',event:'super',data:{x:player.x/W,y:player.y/H,dx:superAim.x,dy:superAim.y,type:'jump'}});$('message').textContent='💥 '+(cfg.name||'ジャンプ')+'！';}else if(superType==='teleport'){const distance=Number(CHARACTER.super?.distance)||130;if(!portals.length){const px=Math.max(player.r+4,Math.min(W-player.r-4,player.x+superAim.x*distance));const py=Math.max(55+player.r,Math.min(H-player.r-4,player.y+superAim.y*distance));portals=[{x:px,y:py,life:7}];sendOnline({type:'event',event:'super',data:{x:player.x/W,y:player.y/H,dx:superAim.x,dy:superAim.y,phase:'place'}});$('message').textContent='🌀 ポータル設置！もう一度ウルトを押してワープ（7秒以内）';}else{const target=portals[0];const from={x:player.x,y:player.y};portals.length=0;player.x=target.x;player.y=target.y;superCd=Number(CHARACTER.super?.cooldown)||7;sendOnline({type:'event',event:'super',data:{x:player.x/W,y:player.y/H,dx:superAim.x,dy:superAim.y,phase:'warp'}});for(let i=0;i<18;i++){const a=Math.PI*2*i/18;particles.push({x:from.x,y:from.y,vx:Math.cos(a)*85,vy:Math.sin(a)*85,t:.35,col:'#d8a5ff'});particles.push({x:player.x,y:player.y,vx:Math.cos(a)*85,vy:Math.sin(a)*85,t:.35,col:'#d8a5ff'});} $('message').textContent='✨ ワープ成功！';}}else{sendOnline({type:'event',event:'super',data:{x:player.x/W,y:player.y/H,dx:superAim.x,dy:superAim.y}});superCd=Number(CHARACTER.super?.cooldown)||7;const speed=Number(CHARACTER.superProjectileSpeed)||350;shots.push({x:player.x+superAim.x*22,y:player.y+superAim.y*22,vx:superAim.x*speed,vy:superAim.y*speed,life:1.8,owner:'p',dmg:(Number(CHARACTER.superDamage)||2300)+power*100,super:true});$('message').textContent=(CHARACTER.super?.name||'ウルト')+' 発動！';}$('message').style.display='block';setTimeout(()=>{if(!ended)$('message').style.display='none'},1200)}
$('homeBtn').onclick=()=>location.href='home.html';$('modeBtn').onclick=()=>location.href='modes.html';$('againBtn').onclick=reset;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function circleHitsRect(x,y,r,o){let px=Math.max(o.x,Math.min(x,o.x+o.w)),py=Math.max(o.y,Math.min(y,o.y+o.h));return Math.hypot(x-px,y-py)<r;}
function blocked(x,y,r){return walls.some(o=>circleHitsRect(x,y,r,o));}
function moveWithWalls(obj,dx,dy,r){let nx=Math.max(r+5,Math.min(W-r-5,obj.x+dx));if(!blocked(nx,obj.y,r))obj.x=nx;let ny=Math.max(60+r,Math.min(H-r-5,obj.y+dy));if(!blocked(obj.x,ny,r))obj.y=ny;}
function update(dt){if(ended)return;if(!matchStarted){countdownRemaining=Math.max(0,countdownRemaining-dt);$('countdown').textContent=countdownRemaining>0.55?String(Math.ceil(countdownRemaining-0.55)):'GO!';if(countdownRemaining<=0){matchStarted=true;$('countdown').style.display='none';move={x:0,y:0};mk.style.transform='';}return;}elapsed+=dt;fireCd=Math.max(0,fireCd-dt);if(ammo<3){reloadTimer-=dt;if(reloadTimer<=0){ammo++;if(ammo<3)reloadTimer=.85;}}superCd=Math.max(0,superCd-dt);healCd=Math.max(0,healCd-dt);stormTimer-=dt;if(stormTimer<=0){stormTimer=12;stormRadius=Math.max(.22,stormRadius-.105)}

for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.owner==='p'){for(let b of bots){if(b.alive&&Math.hypot(b.x-s.x,b.y-s.y)<b.r+5){b.hp-=s.dmg;s.life=0;if(b.hp<=0){b.alive=false;kills++;addKillFeed(CHARACTER.name||'あなた',botName(b.id));crates.push({x:b.x,y:b.y,hp:0,alive:true,drop:true})}break}}for(let box of crates)if(box.alive&&!box.drop&&Math.hypot(box.x-s.x,box.y-s.y)<18){box.hp-=s.dmg;s.life=0;if(box.hp<=0){box.alive=false;box.drop=true;box.x=box.x;box.y=box.y}break}}else{if(hp>0&&Math.hypot(player.x-s.x,player.y-s.y)<player.r+5){hp=Math.max(0,hp-s.dmg);s.life=0;if(hp<=0)addKillFeed(botName(s.owner),CHARACTER.name||'あなた')}if(s.life>0){for(const b of bots){if(!b.alive||b.id===s.owner)continue;if(Math.hypot(b.x-s.x,b.y-s.y)<b.r+5){b.hp-=s.dmg;s.life=0;if(b.hp<=0){b.alive=false;addKillFeed(botName(s.owner),botName(b.id));crates.push({x:b.x,y:b.y,hp:0,alive:true,drop:true})}break}}}}}
shots=shots.filter(s=>s.life>0&&s.x>-20&&s.x<W+20&&s.y>-20&&s.y<H+20);
for(const portal of portals){circle(portal.x,portal.y,23,'#28134d','#b77bff');circle(portal.x,portal.y,14,'#6739a2','#e6c4ff');circle(portal.x,portal.y,6,'#17152f');ctx.fillStyle='#fff';ctx.font='bold 10px system-ui';ctx.textAlign='center';ctx.fillText('ポータル '+Math.ceil(portal.life)+'秒',portal.x,portal.y-30)}
for(let box of crates){if(!box.alive)continue;if(box.drop){if(dist(box,player)<27){box.alive=false;power++;hp=Math.min(MAX_HP,hp+250);for(let i=0;i<12;i++)particles.push({x:box.x,y:box.y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,t:.45,col:'#ffe16b'})}}}
let safeDist=Math.hypot(player.x-center.x,player.y-center.y),safeRad=Math.min(W,H)*.48*stormRadius;if(safeDist>safeRad){hp=Math.max(0,hp-260*dt)}for(let b of bots)if(b.alive&&Math.hypot(b.x-center.x,b.y-center.y)>safeRad)b.hp-=360*dt;if(bots.some(b=>b.alive&&b.hp<=0)){for(let b of bots)if(b.alive&&b.hp<=0){b.alive=false;addKillFeed('🌪 安全エリア',botName(b.id));crates.push({x:b.x,y:b.y,hp:0,alive:true,drop:true})}}
particles.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.t-=dt});particles=particles.filter(a=>a.t>0);portals.forEach(a=>a.life-=dt);portals=portals.filter(a=>a.life>0);
let alive=bots.filter(b=>b.alive).length+ (hp>0?1:0);$('hp').textContent='❤️ HP '+Math.ceil(hp);$('power').textContent='⚡ パワー '+power;$('alive').textContent='👥 残り '+alive+'人';$('time').textContent='⏱ '+String(Math.max(0,Math.ceil(120-elapsed))).padStart(2,'0')+'秒';$('storm').textContent='🌪 縮小まで '+Math.ceil(stormTimer)+'秒';$('pullBtn').disabled=healCd>0;$('pullBtn').style.opacity=healCd>0?'.45':'1';$('hyperBtn').style.opacity=power>=10?'.5':'1';
if(hp<=0)finish(false);else if(alive<=1)finish(true);else if(elapsed>=120)finish(hp>0)}
function finish(won){if(ended)return;ended=true;move={x:0,y:0};$('overlay').style.display='flex';$('resultTitle').textContent=won?'🏆 チャンピオン！':'💥 試合終了';$('resultText').textContent=`撃破 ${kills}人 / パワー ${power}。${won?'最後まで生き残った！':'次はもっと長く生き残ろう！'}`;try{let q=JSON.parse(localStorage.getItem('ba_progress')||'{"coins":0,"trophies":0,"wins":0,"matches":0}');q.coins=(q.coins||0)+(won?80:15);q.trophies=Math.max(0,(q.trophies||0)+(won?6:0));q.wins=(q.wins||0)+(won?1:0);q.matches=(q.matches||0)+1;localStorage.setItem('ba_progress',JSON.stringify(q))}catch{}}
function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){ctx.setTransform(dpr,0,0,dpr,0,0);ctx.clearRect(0,0,viewW,viewH);ctx.save();ctx.translate(-camX,-camY);ctx.fillStyle='#8a6248';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#a77a59';ctx.lineWidth=1;for(let x=0;x<W;x+=34)for(let y=0;y<H;y+=34)ctx.strokeRect(x,y,34,34);
// Walls: high-contrast stone blocks with a thick outline and visible brick seams.
for(const o of walls){
  // Ground shadow makes the wall stand out from the arena floor.
  ctx.fillStyle='rgba(20,18,30,.38)';ctx.fillRect(o.x+5,o.y+6,o.w,o.h);
  ctx.fillStyle='#d1d5df';ctx.fillRect(o.x,o.y,o.w,o.h);

  ctx.fillStyle='#f4f6ff';ctx.fillRect(o.x+2,o.y+2,o.w-4,7);
  ctx.fillStyle='#929bad';ctx.fillRect(o.x+2,o.y+o.h-8,o.w-4,6);
  ctx.strokeStyle='#34394f';ctx.lineWidth=4;ctx.strokeRect(o.x+1,o.y+1,o.w-2,o.h-2);
  // Stone seams, kept inside the outline.
  ctx.strokeStyle='#7b8498';ctx.lineWidth=2;
  ctx.beginPath();ctx.moveTo(o.x+4,o.y+o.h*.52);ctx.lineTo(o.x+o.w-4,o.y+o.h*.52);
  ctx.moveTo(o.x+o.w*.34,o.y+4);ctx.lineTo(o.x+o.w*.34,o.y+o.h*.52);
  ctx.moveTo(o.x+o.w*.68,o.y+o.h*.52);ctx.lineTo(o.x+o.w*.68,o.y+o.h-4);ctx.stroke();
}
// Bushes are visible grass patches that can be used as cover.
for(const b of bushes){ctx.fillStyle='#267544';ctx.fillRect(b.x,b.y,b.w,b.h);ctx.fillStyle='#3b9a55';for(let gx=b.x+5;gx<b.x+b.w-3;gx+=12)for(let gy=b.y+5;gy<b.y+b.h-3;gy+=12){ctx.beginPath();ctx.arc(gx,gy,4,0,Math.PI*2);ctx.fill();}}
for(let i=0;i<14;i++){let xx=(i*83+25)%W,yy=(i*57+75)%(H-80);ctx.fillStyle=i%2?'#276d4a':'#317e50';ctx.fillRect(xx,yy,24,22);circle(xx+12,yy+8,5,'#55b86c')}
let safeR=Math.min(W,H)*.48*stormRadius;ctx.save();ctx.fillStyle='#6252ba30';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(center.x,center.y,safeR,0,Math.PI*2);ctx.fill();ctx.restore();ctx.beginPath();ctx.arc(center.x,center.y,safeR,0,Math.PI*2);ctx.strokeStyle='#b6a6ff';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.stroke();ctx.setLineDash([]);
for(let box of crates){if(!box.alive)continue;if(box.drop){circle(box.x,box.y,12,'#ffe06b','#fff3b0');ctx.fillStyle='#69410a';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('+',box.x,box.y+5)}else{ctx.fillStyle='#895a35';ctx.fillRect(box.x-12,box.y-12,24,24);ctx.strokeStyle='#d6a45f';ctx.lineWidth=3;ctx.strokeRect(box.x-12,box.y-12,24,24);ctx.fillStyle='#241a15';ctx.fillRect(box.x-12,box.y-19,24,4);ctx.fillStyle='#f6b54d';ctx.fillRect(box.x-12,box.y-19,24*Math.max(0,box.hp/1200),4)}}
for(let s of shots)circle(s.x,s.y,s.super?7:4,s.owner==='p'?(s.super?'#d8a5ff':'#f7edac'):'#ff7189',s.super?'#ffffff':null);for(let b of bots)if(b.alive){circle(b.x,b.y+3,b.r+2,'#6a273e');circle(b.x,b.y,b.r,b.color,'#ffe0cf');circle(b.x-4,b.y-3,2,'#24192a');circle(b.x+4,b.y-3,2,'#24192a');ctx.fillStyle='#2a1725';ctx.fillRect(b.x-18,b.y-25,36,4);ctx.fillStyle='#ff5e77';ctx.fillRect(b.x-18,b.y-25,36*Math.max(0,b.hp/b.maxHp),4)}
for(const rp of remotePlayers.values()){if(!rp.alive)continue;const rx=rp.x*W,ry=rp.y*H;circle(rx,ry+4,19,'#173f70');circle(rx,ry,16,'#54c8ff','#e2f7ff');circle(rx-5,ry-3,2.5,'#102039');circle(rx+5,ry-3,2.5,'#102039');ctx.fillStyle='#07172b';ctx.font='bold 11px system-ui';ctx.textAlign='center';ctx.fillText(String(rp.name||'プレイヤー').slice(0,12),rx,ry-24);ctx.fillStyle='#13283b';ctx.fillRect(rx-18,ry-20,36,4);ctx.fillStyle='#6bff9b';ctx.fillRect(rx-18,ry-20,36*Math.max(0,Math.min(1,(Number(rp.hp)||0)/4800)),4);}
circle(player.x,player.y+4,19,'#236e51');circle(player.x,player.y,Number(CHARACTER.appearance?.radius ?? CHARACTER.radius)||16,CHARACTER.appearance?.color||'#f3eaff',CHARACTER.appearance?.projectileColor||'#b98aff');circle(player.x-5,player.y-3,2.5,'#19172d');circle(player.x+5,player.y-3,2.5,'#19172d');ctx.textAlign='center';ctx.font='bold 11px system-ui';ctx.fillStyle='#fff';ctx.strokeStyle='rgba(15,12,30,.9)';ctx.lineWidth=3;const overheadName=CHARACTER.name||'プレイヤー';ctx.strokeText(overheadName,player.x,player.y-54);ctx.fillText(overheadName,player.x,player.y-54);ctx.fillStyle='#241c2d';ctx.fillRect(player.x-24,player.y-47,48,5);ctx.fillStyle='#54e878';ctx.fillRect(player.x-24,player.y-47,48*Math.max(0,hp/MAX_HP),5);ctx.font='bold 9px system-ui';ctx.fillStyle='#fff';ctx.strokeText(Math.ceil(hp)+' / '+MAX_HP,player.x,player.y-38);ctx.fillText(Math.ceil(hp)+' / '+MAX_HP,player.x,player.y-38);ctx.font='bold 10px system-ui';ctx.strokeText('リロード '+('●'.repeat(ammo))+('○'.repeat(3-ammo)),player.x,player.y-26);ctx.fillText('リロード '+('●'.repeat(ammo))+('○'.repeat(3-ammo)),player.x,player.y-26);
if(aimPid!==null&&aimActive){ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle='#fff0a4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(player.x+aim.x*20,player.y+aim.y*20);ctx.lineTo(player.x+aim.x*Math.min(130,Math.min(W,H)*.3),player.y+aim.y*Math.min(130,Math.min(W,H)*.3));ctx.stroke();ctx.restore()}if(superAimPid!==null&&superAimActive){ctx.save();ctx.setLineDash([4,5]);ctx.strokeStyle='#e0a7ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(player.x+superAim.x*20,player.y+superAim.y*20);ctx.lineTo(player.x+superAim.x*Math.min(120,Math.min(W,H)*.27),player.y+superAim.y*Math.min(120,Math.min(W,H)*.27));ctx.stroke();ctx.restore()}
for(let a of particles)circle(a.x,a.y,3,a.col);ctx.restore()}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;resize();update(dt);if(onlineReady&&t-lastNetSend>100){lastNetSend=t;sendOnline({type:'state',x:player.x/W,y:player.y/H,hp,alive:hp>0&&!ended});}const targetCamX=Math.max(0,Math.min(W-viewW,player.x-viewW/2)),targetCamY=Math.max(0,Math.min(H-viewH,player.y-viewH/2));camX+=(targetCamX-camX)*Math.min(1,dt*8);camY+=(targetCamY-camY)*Math.min(1,dt*8);draw();if(!ended)requestAnimationFrame(loop);else draw()}
connectOnline();resize();reset();
})();
