<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#11132b"><title>BRAWL ARENA | サバイバル</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#11152a;color:#fff;font-family:system-ui,-apple-system,sans-serif;touch-action:none}.shell{height:100dvh;display:flex;flex-direction:column}.top{height:48px;flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:0 12px;background:#0b0e20;border-bottom:1px solid #41466f}.brand{color:#d8b6ff;text-decoration:none;font-weight:1000;font-size:13px}.btn{border:1px solid #656da2;border-radius:10px;padding:7px 10px;color:white;background:#292f58;font-size:12px;font-weight:900}#stage{position:relative;flex:1;min-height:0}canvas{display:block;width:100%;height:100%}#hud{position:absolute;top:8px;left:9px;right:9px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 3px #000;font-size:12px;font-weight:900}#hud .right{text-align:right}#message{position:absolute;left:50%;top:24%;transform:translateX(-50%);background:#101327dd;border:1px solid #c8a1ff;border-radius:14px;padding:10px 15px;text-align:center;display:none;max-width:90%;pointer-events:none;font-weight:1000}#controls{position:absolute;bottom:10px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 12px;pointer-events:none}.unit{pointer-events:none;text-align:center;font-size:10px;color:#e4e8ff;text-shadow:0 1px 3px #000}.stick{width:105px;height:105px;border:2px solid #a6b4ff99;border-radius:50%;background:#101a3aaa;position:relative;pointer-events:auto;touch-action:none}.knob{position:absolute;left:29px;top:29px;width:43px;height:43px;border-radius:50%;background:#9bb5ffcc;border:2px solid white}.aimstick{border-color:#ffe09aab;background:#3b2b12aa}.aimstick .knob{background:#ffd47ccc}.right{display:flex;flex-direction:column;align-items:flex-end;gap:8px;pointer-events:none}.ability-buttons{display:flex;gap:8px;align-items:center;pointer-events:auto}.ability{pointer-events:auto;border:4px solid #ffffff66;border-radius:50%;width:58px;height:58px;padding:3px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;font-weight:1000;color:white;touch-action:manipulation;box-shadow:0 3px 8px #0006}.ability small{font-size:8px;line-height:1.1}.hyper{background:linear-gradient(#e95aff,#8514ce);border-color:#f2aaff}.gadget{background:linear-gradient(#76ff39,#17a928);border-color:#b7ff94}.aim-pads{display:flex;gap:8px;align-items:end;pointer-events:none}.aim-unit{display:flex;flex-direction:column;gap:4px;align-items:center;pointer-events:none}.aimstick{width:78px;height:78px;border:2px solid #ffdf9a99;border-radius:50%;background:#33271199;position:relative;pointer-events:auto;touch-action:none}.aimstick .knob{left:18px;top:18px;width:38px;height:38px;background:#ffd47cbb;border-color:#fff1cb}.super-aimstick{border-color:#d8a5ffbb;background:#351b4eaa}.super-aimstick .knob{background:#d8a5ffbb;border-color:#f4dfff}.mini{font-size:10px;color:#ffe7aa;text-align:center;text-shadow:0 1px 3px #000}.super-mini{color:#edcaff}.overlay{position:absolute;inset:0;background:#0a0d20eF;display:none;align-items:center;justify-content:center;padding:20px}.result{max-width:350px;width:100%;text-align:center;background:linear-gradient(145deg,#28294f,#15192f);border:2px solid #7772c4;border-radius:22px;padding:24px}.result h1{margin:0 0 8px;font-size:30px}.result p{color:#c8d0ef;line-height:1.5}.primary{width:100%;padding:13px;background:linear-gradient(120deg,#ffcf4a,#f28a24);color:#48290a;border:2px solid #ffe69b;border-radius:13px;font-weight:1000;margin-top:8px}
</style></head><body><div class="shell"><header class="top"><a class="brand" href="home.html">✦ BRAWL ARENA / SURVIVAL</a><button class="btn" id="homeBtn">ホームへ</button></header><main id="stage"><canvas id="arena"></canvas><div id="hud"><div><div id="hp">❤️ HP 4800</div><div id="power">⚡ パワー 0</div><div id="alive">👥 残り 10人</div></div><div class="right"><div id="time">⏱ 02:00</div><div id="storm">🌪 安全エリア縮小まで 15</div></div></div><div id="message"></div><div id="controls"><div class="unit"><div class="stick" id="moveStick"><div class="knob" id="moveKnob"></div></div>移動</div><div class="right"><div class="ability-buttons"><button class="ability hyper" id="hyperBtn">⚡<small>ハイパー</small></button><button class="ability gadget" id="pullBtn">☻<small>ガジェット</small></button></div><div class="aim-pads"><div class="aim-unit"><div class="aimstick" id="aimStick"><div class="knob" id="aimKnob"></div></div><div class="mini">攻撃</div></div><div class="aim-unit"><div class="aimstick super-aimstick" id="superAimStick"><div class="knob" id="superAimKnob"></div></div><div class="mini super-mini">ウルト照準</div></div></div></div></div><div class="overlay" id="overlay"><div class="result"><h1 id="resultTitle">試合終了</h1><p id="resultText"></p><button class="primary" id="againBtn">もう一度</button><button class="btn" style="width:100%;margin-top:8px" id="modeBtn">モード選択へ</button></div></div></main></div>
<script>
(()=>{const $=id=>document.getElementById(id);if(!localStorage.getItem('ba_demo_session')){location.href='index.html';return}
const c=$('arena'),ctx=c.getContext('2d');let W=800,H=500,dpr=1,last=0,ended=false,elapsed=0,move={x:0,y:0},aim={x:1,y:0},movePid=null,aimPid=null,superAimPid=null,aimActive=false,superAimActive=false,shots=[],particles=[],bots=[],crates=[],kills=0,power=0,hp=4800,fireCd=0,superCd=0,stormRadius=1,stormTimer=15,healCd=0;
const player={x:0,y:0,r:16};let center={x:0,y:0},superAim={x:1,y:0};
function resize(){let r=c.getBoundingClientRect();dpr=Math.min(devicePixelRatio||1,2);c.width=Math.max(1,Math.floor(r.width*dpr));c.height=Math.max(1,Math.floor(r.height*dpr));W=r.width;H=r.height;ctx.setTransform(dpr,0,0,dpr,0,0);center={x:W/2,y:H/2}}
function reset(){ended=false;elapsed=0;kills=0;power=0;hp=4800;fireCd=0;superCd=0;healCd=0;stormRadius=1;stormTimer=15;shots=[];particles=[];player.x=W*.5;player.y=H*.5;bots=[];for(let i=0;i<9;i++){let a=Math.PI*2*i/9+Math.random()*.3,rad=Math.min(W,H)*(.25+Math.random()*.13);bots.push({x:Math.max(25,Math.min(W-25,center.x+Math.cos(a)*rad)),y:Math.max(70,Math.min(H-25,center.y+Math.sin(a)*rad)),r:15,hp:2500,maxHp:2500,cd:1+Math.random()*2,alive:true,spd:35+Math.random()*22,color:['#e75d70','#d78a43','#8e6be0','#43a9a4'][i%4]})}crates=[];for(let i=0;i<7;i++)crates.push({x:35+Math.random()*(W-70),y:75+Math.random()*(H-120),hp:1200,alive:true});$('overlay').style.display='none';$('message').style.display='none';$('hp').textContent='❤️ HP '+hp;last=performance.now();requestAnimationFrame(loop)}
function nearest(list,from){return list.filter(o=>o.alive&&o!==from).map(o=>({o,d:Math.hypot(o.x-from.x,o.y-from.y)})).sort((a,b)=>a.d-b.d)[0]}
function shoot(){if(ended||fireCd>0)return;fireCd=.32;if(!aimActive){let target=nearest(bots,player);if(target){let dx=target.o.x-player.x,dy=target.o.y-player.y,d=Math.hypot(dx,dy)||1;aim={x:dx/d,y:dy/d}}}shots.push({x:player.x+aim.x*20,y:player.y+aim.y*20,vx:aim.x*440,vy:aim.y*440,life:1.15,owner:'p',dmg:950+power*100})}
function setStick(e,el,knob,kind){let r=el.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),max=32;if(d>max){dx=dx/d*max;dy=dy/d*max}let z=Math.hypot(dx,dy);if(kind==='move'){move={x:dx/max,y:dy/max}}else if(z>10){aim={x:dx/z,y:dy/z};aimActive=true}knob.style.transform=`translate(${dx}px,${dy}px)`}
const ms=$('moveStick'),mk=$('moveKnob'),as=$('aimStick'),ak=$('aimKnob'),sas=$('superAimStick'),sak=$('superAimKnob');
ms.onpointerdown=e=>{e.preventDefault();movePid=e.pointerId;ms.setPointerCapture(movePid);setStick(e,ms,mk,'move')};ms.onpointermove=e=>{if(e.pointerId===movePid)setStick(e,ms,mk,'move')};function stopMove(){movePid=null;move={x:0,y:0};mk.style.transform=''}ms.onpointerup=stopMove;ms.onpointercancel=stopMove;
as.onpointerdown=e=>{e.preventDefault();aimPid=e.pointerId;as.setPointerCapture(aimPid);aimActive=false;setStick(e,as,ak,'aim')};as.onpointermove=e=>{if(e.pointerId===aimPid)setStick(e,as,ak,'aim')};as.onpointerup=e=>{if(e.pointerId!==aimPid)return;shoot();aimPid=null;aimActive=false;ak.style.transform=''};as.onpointercancel=()=>{aimPid=null;aimActive=false;ak.style.transform=''};
function setSuperStick(e){let r=sas.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,d=Math.hypot(dx,dy),max=25;if(d>max){dx=dx/d*max;dy=dy/d*max}let z=Math.hypot(dx,dy);if(z>8){superAim={x:dx/z,y:dy/z};superAimActive=true} sak.style.transform=`translate(${dx}px,${dy}px)`}
sas.onpointerdown=e=>{e.preventDefault();superAimPid=e.pointerId;sas.setPointerCapture(superAimPid);superAimActive=false;setSuperStick(e)};sas.onpointermove=e=>{if(e.pointerId===superAimPid)setSuperStick(e)};sas.onpointerup=e=>{if(e.pointerId!==superAimPid)return;useSuper();superAimPid=null;superAimActive=false;sak.style.transform=''};sas.onpointercancel=()=>{superAimPid=null;superAimActive=false;sak.style.transform=''};
$('hyperBtn').onclick=()=>{if(!ended){power=Math.min(10,power+1);$('message').textContent='⚡ ハイパーチャージ！パワーが上がった';$('message').style.display='block';setTimeout(()=>{if(!ended)$('message').style.display='none'},900)}};
$('pullBtn').onclick=()=>{if(!ended&&healCd<=0&&hp<4800){hp=Math.min(4800,hp+800);healCd=8;for(let i=0;i<16;i++)particles.push({x:player.x,y:player.y,vx:(Math.random()-.5)*100,vy:(Math.random()-.5)*100,t:.5,col:'#77ff8a'})}};
function useSuper(){if(ended||superCd>0)return;superCd=7;shots.push({x:player.x+superAim.x*20,y:player.y+superAim.y*20,vx:superAim.x*350,vy:superAim.y*350,life:1.5,owner:'p',dmg:2300+power*100,super:true});}
$('homeBtn').onclick=()=>location.href='home.html';$('modeBtn').onclick=()=>location.href='modes.html';$('againBtn').onclick=reset;
function dist(a,b){return Math.hypot(a.x-b.x,a.y-b.y)}
function update(dt){if(ended)return;elapsed+=dt;fireCd=Math.max(0,fireCd-dt);superCd=Math.max(0,superCd-dt);healCd=Math.max(0,healCd-dt);stormTimer-=dt;if(stormTimer<=0){stormTimer=12;stormRadius=Math.max(.22,stormRadius-.105)}
player.x=Math.max(18,Math.min(W-18,player.x+move.x*(190+power*5)*dt));player.y=Math.max(55,Math.min(H-18,player.y+move.y*(190+power*5)*dt));
for(let b of bots){if(!b.alive)continue;b.cd-=dt;let d=dist(b,player);let target=player;if(d<155){let dx=b.x-player.x,dy=b.y-player.y,dd=Math.hypot(dx,dy)||1;b.x+=dx/dd*b.spd*dt;b.y+=dy/dd*b.spd*dt}else{let dx=player.x-b.x,dy=player.y-b.y,dd=Math.hypot(dx,dy)||1;b.x+=dx/dd*b.spd*.45*dt;b.y+=dy/dd*b.spd*.45*dt}
if(b.cd<=0&&d<Math.min(W,H)*.55){b.cd=1.1+Math.random()*.9;let dx=player.x-b.x,dy=player.y-b.y,dd=Math.hypot(dx,dy)||1;shots.push({x:b.x,y:b.y,vx:dx/dd*220,vy:dy/dd*220,life:1.6,owner:'b',dmg:210})}}
for(let s of shots){s.x+=s.vx*dt;s.y+=s.vy*dt;s.life-=dt;if(s.owner==='p'){for(let b of bots){if(b.alive&&Math.hypot(b.x-s.x,b.y-s.y)<b.r+5){b.hp-=s.dmg;s.life=0;if(b.hp<=0){b.alive=false;kills++;crates.push({x:b.x,y:b.y,hp:0,alive:true,drop:true})}break}}for(let box of crates)if(box.alive&&!box.drop&&Math.hypot(box.x-s.x,box.y-s.y)<18){box.hp-=s.dmg;s.life=0;if(box.hp<=0){box.alive=false;box.drop=true;box.x=box.x;box.y=box.y}break}}else if(Math.hypot(player.x-s.x,player.y-s.y)<player.r+5){hp=Math.max(0,hp-s.dmg);s.life=0}}
shots=shots.filter(s=>s.life>0&&s.x>-20&&s.x<W+20&&s.y>-20&&s.y<H+20);
for(let box of crates){if(!box.alive)continue;if(box.drop){if(dist(box,player)<27){box.alive=false;power++;hp=Math.min(4800,hp+250);for(let i=0;i<12;i++)particles.push({x:box.x,y:box.y,vx:(Math.random()-.5)*130,vy:(Math.random()-.5)*130,t:.45,col:'#ffe16b'})}}}
let safeDist=Math.hypot(player.x-center.x,player.y-center.y),safeRad=Math.min(W,H)*.48*stormRadius;if(safeDist>safeRad){hp=Math.max(0,hp-260*dt)}for(let b of bots)if(b.alive&&Math.hypot(b.x-center.x,b.y-center.y)>safeRad)b.hp-=360*dt;if(bots.some(b=>b.alive&&b.hp<=0)){for(let b of bots)if(b.alive&&b.hp<=0){b.alive=false;kills++;crates.push({x:b.x,y:b.y,hp:0,alive:true,drop:true})}}
particles.forEach(a=>{a.x+=a.vx*dt;a.y+=a.vy*dt;a.t-=dt});particles=particles.filter(a=>a.t>0);
let alive=bots.filter(b=>b.alive).length+ (hp>0?1:0);$('hp').textContent='❤️ HP '+Math.ceil(hp);$('power').textContent='⚡ パワー '+power;$('alive').textContent='👥 残り '+alive+'人';$('time').textContent='⏱ '+String(Math.max(0,Math.ceil(120-elapsed))).padStart(2,'0')+'秒';$('storm').textContent='🌪 縮小まで '+Math.ceil(stormTimer)+'秒';$('pullBtn').disabled=healCd>0;$('pullBtn').style.opacity=healCd>0?'.45':'1';$('hyperBtn').style.opacity=power>=10?'.5':'1';
if(hp<=0)finish(false);else if(alive<=1)finish(true);else if(elapsed>=120)finish(hp>0)}
function finish(won){if(ended)return;ended=true;move={x:0,y:0};$('overlay').style.display='flex';$('resultTitle').textContent=won?'🏆 チャンピオン！':'💥 試合終了';$('resultText').textContent=`撃破 ${kills}人 / パワー ${power}。${won?'最後まで生き残った！':'次はもっと長く生き残ろう！'}`;try{let q=JSON.parse(localStorage.getItem('ba_progress')||'{"coins":0,"trophies":0,"wins":0,"matches":0}');q.coins=(q.coins||0)+(won?80:15);q.trophies=Math.max(0,(q.trophies||0)+(won?6:0));q.wins=(q.wins||0)+(won?1:0);q.matches=(q.matches||0)+1;localStorage.setItem('ba_progress',JSON.stringify(q))}catch{}}
function circle(x,y,r,fill,stroke){ctx.beginPath();ctx.arc(x,y,r,0,Math.PI*2);ctx.fillStyle=fill;ctx.fill();if(stroke){ctx.strokeStyle=stroke;ctx.lineWidth=2;ctx.stroke()}}
function draw(){ctx.clearRect(0,0,W,H);ctx.fillStyle='#8a6248';ctx.fillRect(0,0,W,H);ctx.strokeStyle='#a77a59';ctx.lineWidth=1;for(let x=0;x<W;x+=34)for(let y=0;y<H;y+=34)ctx.strokeRect(x,y,34,34);
for(let i=0;i<14;i++){let xx=(i*83+25)%W,yy=(i*57+75)%(H-80);ctx.fillStyle=i%2?'#276d4a':'#317e50';ctx.fillRect(xx,yy,24,22);circle(xx+12,yy+8,5,'#55b86c')}
let safeR=Math.min(W,H)*.48*stormRadius;ctx.save();ctx.fillStyle='#6252ba30';ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation='destination-out';ctx.beginPath();ctx.arc(center.x,center.y,safeR,0,Math.PI*2);ctx.fill();ctx.restore();ctx.beginPath();ctx.arc(center.x,center.y,safeR,0,Math.PI*2);ctx.strokeStyle='#b6a6ff';ctx.lineWidth=3;ctx.setLineDash([8,6]);ctx.stroke();ctx.setLineDash([]);
for(let box of crates){if(!box.alive)continue;if(box.drop){circle(box.x,box.y,12,'#ffe06b','#fff3b0');ctx.fillStyle='#69410a';ctx.font='bold 13px system-ui';ctx.textAlign='center';ctx.fillText('+',box.x,box.y+5)}else{ctx.fillStyle='#895a35';ctx.fillRect(box.x-12,box.y-12,24,24);ctx.strokeStyle='#d6a45f';ctx.lineWidth=3;ctx.strokeRect(box.x-12,box.y-12,24,24);ctx.fillStyle='#241a15';ctx.fillRect(box.x-12,box.y-19,24,4);ctx.fillStyle='#f6b54d';ctx.fillRect(box.x-12,box.y-19,24*Math.max(0,box.hp/1200),4)}}
for(let s of shots)circle(s.x,s.y,4,s.owner==='p'?'#f7edac':'#ff7189');for(let b of bots)if(b.alive){circle(b.x,b.y+3,b.r+2,'#6a273e');circle(b.x,b.y,b.r,b.color,'#ffe0cf');circle(b.x-4,b.y-3,2,'#24192a');circle(b.x+4,b.y-3,2,'#24192a');ctx.fillStyle='#2a1725';ctx.fillRect(b.x-18,b.y-25,36,4);ctx.fillStyle='#ff5e77';ctx.fillRect(b.x-18,b.y-25,36*Math.max(0,b.hp/b.maxHp),4)}
circle(player.x,player.y+4,19,'#236e51');circle(player.x,player.y,16,'#f3eaff','#b98aff');circle(player.x-5,player.y-3,2.5,'#19172d');circle(player.x+5,player.y-3,2.5,'#19172d');
if(aimPid!==null&&aimActive){ctx.save();ctx.setLineDash([6,5]);ctx.strokeStyle='#fff0a4';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(player.x+aim.x*20,player.y+aim.y*20);ctx.lineTo(player.x+aim.x*Math.min(130,Math.min(W,H)*.3),player.y+aim.y*Math.min(130,Math.min(W,H)*.3));ctx.stroke();ctx.restore()}if(superAimPid!==null&&superAimActive){ctx.save();ctx.setLineDash([4,5]);ctx.strokeStyle='#e0a7ff';ctx.lineWidth=2;ctx.beginPath();ctx.moveTo(player.x+superAim.x*20,player.y+superAim.y*20);ctx.lineTo(player.x+superAim.x*Math.min(120,Math.min(W,H)*.27),player.y+superAim.y*Math.min(120,Math.min(W,H)*.27));ctx.stroke();ctx.restore()}
for(let a of particles)circle(a.x,a.y,3,a.col)}
function loop(t){let dt=Math.min(.04,(t-last)/1000||0);last=t;resize();update(dt);draw();if(!ended)requestAnimationFrame(loop);else draw()}
resize();reset();
})();
</script></body></html>
