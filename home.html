<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1"><meta name="theme-color" content="#11132b"><title>BRAWL ARENA | ホーム</title><style>
*{box-sizing:border-box} :root{color-scheme:dark;--bg:#101327;--panel:#1b2040;--line:#454b85;--purple:#a56bff;--mint:#77f0d3}html,body{margin:0;min-height:100%;background:radial-gradient(ellipse at top,#26204b,#101327 65%);color:#f7f8ff;font-family:system-ui,-apple-system,sans-serif}button,input{font:inherit}button{cursor:pointer;border:1px solid #656da2;border-radius:13px;padding:10px 14px;color:white;background:#292f58;font-weight:800}button:active{transform:scale(.98)}input{width:100%;border:1px solid #454b75;background:#11172d;color:white;border-radius:12px;padding:12px;outline:none}input:focus{border-color:#b794ff}.brand{font-weight:1000;letter-spacing:1px;color:#d8b6ff;text-decoration:none}.auth-wrap{min-height:100dvh;display:flex;flex-direction:column;align-items:center;padding:24px 16px;gap:20px}.auth-wrap>.brand{font-size:20px;margin-top:10px}.card{background:linear-gradient(145deg,#202344,#171b35);border:1px solid #414875;border-radius:20px;padding:18px;box-shadow:0 12px 40px #05071344}.auth-card{width:min(100%,430px);text-align:center}.orb{width:76px;height:76px;flex-shrink:0;border-radius:50%;background:radial-gradient(circle at 30% 25%,#fff,#d8d5ff 45%,#7653b8);border:5px solid #e8d9ff;box-shadow:0 0 24px #a76bff88;position:relative}.orb:before{content:"";position:absolute;top:-13px;left:14px;width:35px;height:15px;border:4px solid #b77bff;border-radius:50%;transform:rotate(-25deg)}.big-orb{margin:0 auto 12px;width:88px;height:88px}.eyebrow{font-size:11px;letter-spacing:2px;font-weight:900;color:#c7a8ff;margin:8px 0}.muted,.fineprint{color:#bdc5e8;line-height:1.55}.muted{font-size:14px}.fineprint{font-size:11px;margin-top:15px}.tabs{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:#11172d;padding:5px;border-radius:14px;margin:18px 0}.tab{background:transparent;border-color:transparent}.tab.active{background:#3c2b67;border-color:#8e70cb}form label{display:block;text-align:left;font-size:13px;font-weight:800;margin:12px 0 6px}form input{margin-bottom:4px}.primary{background:linear-gradient(120deg,#8143d9,#4d4bd5);border-color:#bd98ff}.secondary{background:#214e5a;border-color:#62cbbf}.full{width:100%;margin-top:14px}.message{min-height:20px;font-size:13px;color:#a9f3d4}.app-shell,.game-shell{min-height:100dvh;display:flex;flex-direction:column}.topbar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:12px 14px;background:#0b0e20;border-bottom:1px solid #37395e}.top-actions{display:flex;align-items:center;gap:8px}.pill,.tag{font-size:11px;background:#6c38a6;border-radius:99px;padding:5px 9px;font-weight:900}.ghost{background:#171b35;border-color:#454b7c;padding:8px 10px;font-size:12px}.home-main{width:min(100%,980px);margin:auto;padding:16px;display:flex;flex-direction:column;gap:14px}.welcome{display:flex;align-items:center;justify-content:space-between;gap:10px}.welcome h1{font-size:clamp(22px,5vw,32px);margin:3px 0}.hero-orb{width:88px;height:88px}.home-grid{display:grid;grid-template-columns:1fr;gap:14px}.home-grid h2{margin:0 0 10px;font-size:18px}.inline-form{display:flex;gap:8px}.inline-form input{min-width:0}.inline-form button{flex-shrink:0}.friend-list{list-style:none;padding:0;margin:8px 0 0}.friend-list li{padding:9px 10px;border-radius:10px;background:#11172d;margin-top:6px}.fighter-row{display:flex;align-items:center;gap:12px;margin:14px 0}.fighter-row h3{margin:0 0 5px}.fighter-row p{margin:7px 0}.team-members{display:flex;gap:8px;flex-wrap:wrap;margin:12px 0}.member{background:#11172d;padding:9px 11px;border-radius:99px;font-size:13px}.game-body{height:100dvh;overflow:hidden}.game-shell{height:100dvh;min-height:0}#game{flex:1;min-height:0;position:relative}canvas{width:100%;height:100%;display:block}#hud{position:absolute;left:10px;right:10px;top:9px;display:flex;justify-content:space-between;align-items:flex-start;pointer-events:none;text-shadow:0 2px 3px #000}#hud button{pointer-events:auto}.hud-name{color:#d9b6ff}.small{font-size:11px;color:#e0e4ff}.hp-track{width:125px;height:8px;background:#3d233e;border-radius:99px;overflow:hidden}.hp-track div{height:100%;width:100%;background:#65ef94}.game-buttons{display:flex;gap:6px;align-items:end;pointer-events:auto}.circle{width:62px;height:62px;border-radius:50%;font-size:10px;padding:3px;background:#263c78;border:3px solid #91b9ff}.circle.super{background:#5a2c9b;border-color:#d8a5ff}.circle.gadget{background:#236c68;border-color:#77f0d3;width:56px;height:56px}#controls{position:absolute;bottom:12px;left:0;right:0;display:flex;justify-content:space-between;align-items:end;padding:0 12px;pointer-events:none}.stick{width:106px;height:106px;border:2px solid #a6b4ff88;border-radius:50%;background:#101a3a99;position:relative;pointer-events:auto;touch-action:none}.knob{position:absolute;left:30px;top:30px;width:42px;height:42px;border-radius:50%;background:#9bb5ffbb;border:2px solid white}@media(min-width:700px){.home-grid{grid-template-columns:1fr 1fr}.team-card{grid-column:1/-1}.home-main{padding:24px}.skills{grid-template-columns:repeat(3,1fr)}}
</style></head>
<body><div class="app-shell">
<header class="topbar"><a class="brand" href="home.html">✦ BRAWL ARENA</a><div class="top-actions"><span id="playerLabel" class="pill">プレイヤー</span><button id="logoutBtn" class="ghost">ログアウト</button></div></header>
<main class="home-main">
<section class="card" style="display:grid;grid-template-columns:repeat(3,1fr);gap:10px;text-align:center"><div><div class="muted">🪙 コイン</div><strong id="coinsStat">0</strong></div><div><div class="muted">🏆 トロフィー</div><strong id="trophiesStat">0</strong></div><div><div class="muted">⚔️ 勝利数</div><strong id="winsStat">0</strong></div></section>
<section class="welcome card"><div><p class="eyebrow">LOBBY</p><h1>ようこそ、<span id="welcomeName">プレイヤー</span>！</h1><p class="muted">フレンドを集めて、チームでアリーナへ出撃しよう。</p></div><div class="orb hero-orb"></div></section>
<div class="home-grid">
<section class="card"><h2>👥 フレンド</h2><p class="muted">IDを入力してフレンド候補に追加しよう（この試作では同じブラウザ内のみ）。</p><form id="friendForm" class="inline-form"><input id="friendId" placeholder="フレンドのプレイヤーID" maxlength="18" required><button class="secondary" type="submit">追加</button></form><p id="friendMessage" class="message"></p><ul id="friendList" class="friend-list"></ul></section>
<section class="card"><h2>🧑‍🚀 ファイター</h2><div class="fighter-row"><div class="orb"></div><div><h3>テレポーター</h3><span class="tag">エピック</span><p class="muted">ポータルと引き寄せガジェットを使うファイター。</p></div></div><button id="selectFighter" class="secondary full">テレポーターを選択 ✓</button></section>
<section class="card team-card"><h2>⚔️ チーム</h2><p class="muted">現在のチーム：<b id="teamCount">1 / 3</b></p><div id="teamMembers" class="team-members"><span class="member">● <span id="teamSelf">あなた</span></span></div><p class="fineprint">オンライン招待はまだ未接続。フレンド機能は画面の動作確認用です。</p><button id="playBtn" class="primary full">▶ 試合に出撃</button></section></div>
</main></div><script>
(()=>{const id=localStorage.getItem('ba_demo_session');if(!id){location.href='index.html';return}const $=x=>document.getElementById(x),friendsKey='ba_demo_friends_'+id.toLowerCase();$('welcomeName').textContent=id;$('playerLabel').textContent='ID: '+id;$('teamSelf').textContent=id;function renderStats(){let q={};try{q=JSON.parse(localStorage.getItem('ba_progress')||'{}')}catch{}$('coinsStat').textContent=q.coins||0;$('trophiesStat').textContent=q.trophies||0;$('winsStat').textContent=q.wins||0}function render(){renderStats();let f=[];try{f=JSON.parse(localStorage.getItem(friendsKey)||'[]')}catch{}$('friendList').innerHTML='';f.forEach(n=>{let li=document.createElement('li');li.textContent='● '+n;$('friendList').appendChild(li)});$('teamCount').textContent=(1+f.length)+' / 3';$('teamMembers').innerHTML='';[id,...f.slice(0,2)].forEach(n=>{let s=document.createElement('span');s.className='member';s.textContent='● '+n;$('teamMembers').appendChild(s)})}$('friendForm').onsubmit=e=>{e.preventDefault();let n=$('friendId').value.trim();if(!/^[a-zA-Z0-9_]{3,18}$/.test(n)){$('friendMessage').textContent='IDは英数字と_で3〜18文字だよ';return}if(n.toLowerCase()===id.toLowerCase()){$('friendMessage').textContent='自分自身は追加できないよ';return}let f=[];try{f=JSON.parse(localStorage.getItem(friendsKey)||'[]')}catch{}if(f.some(x=>x.toLowerCase()===n.toLowerCase())){$('friendMessage').textContent='追加済みだよ';return}if(f.length>=9){$('friendMessage').textContent='試作版ではフレンドは9人までだよ';return}f.push(n);localStorage.setItem(friendsKey,JSON.stringify(f));$('friendId').value='';$('friendMessage').textContent='リストに追加したよ（試作版）';render()};$('selectFighter').onclick=()=>{$('selectFighter').textContent='テレポーターを選択 ✓';$('selectFighter').classList.add('primary')};$('playBtn').onclick=()=>location.href='game.html';$('logoutBtn').onclick=()=>{localStorage.removeItem('ba_demo_session');location.href='index.html'};render()})();
</script></body></html>
