<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<meta name="theme-color" content="#11132b"><title>BRAWL ARENA | ログイン</title>
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<main class="auth-wrap">
  <div class="brand">✦ BRAWL ARENA</div>
  <section class="card auth-card">
    <div class="orb big-orb"></div>
    <p class="eyebrow">WELCOME TO THE ARENA</p>
    <h1 id="formTitle">アカウント登録</h1>
    <p class="muted">自分だけのファイターでアリーナへ！</p>
    <div class="tabs"><button id="registerTab" class="tab active">新規登録</button><button id="loginTab" class="tab">ログイン</button></div>
    <form id="authForm">
      <label for="playerId">プレイヤーID</label><input id="playerId" minlength="3" maxlength="18" autocomplete="username" required placeholder="英数字3〜18文字">
      <label for="password">パスワード</label><input id="password" type="password" minlength="8" autocomplete="new-password" required placeholder="8文字以上">
      <button class="primary full" type="submit" id="submitBtn">アカウントを作成</button>
    </form>
    <p id="message" class="message" role="status"></p>
    <p class="fineprint">試作版：アカウント情報はこのブラウザ内だけに保存されます。別端末との同期や安全な本番認証はまだ未対応です。</p>
  </section>
</main>
<script src="js/auth.js"></script>
</body></html>
